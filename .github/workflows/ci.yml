name: CI
on:
  push:
    branches: [main]
  pull_request:
  # REQUIRED by the merge queue: a queue entry is built on its own
  # `gh-readonly-queue/main/...` ref, which emits NEITHER `pull_request` NOR
  # `push`. Without this trigger the required `checks` context never reports on a
  # queued entry and every merge times out.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: kattakath
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Flake outputs well-formed
        run: nix flake show
      # Runs this runner's own system: `module-evaluates` AND `treefmt`. Formatting
      # is deliberately NOT a separate step — a bare `nix run nixpkgs#nixfmt-rfc-style`
      # resolves against the RUNNER's registry, so it is unpinned and drifts from
      # what `nix fmt` uses locally. `checks.treefmt` comes from this repo's lock.
      - name: Checks
        run: nix flake check -L
